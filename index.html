<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect to .koble to interact with your friends!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/pages/index.css">
    <title> .koble</title>
</head>

<body>
    <header>
        <h1>.koble</h1>
    </header>
    <main>
        <div id="container">
            <form id="login-form">
                <fieldset>
                    <p id="status"></p>
                    <label for="email">E-mail:</label>
                    <input id="email" name="email" type="email" placeholder="koble@stud.noroff.no" required>
                    <label for="password">Password:</label>
                    <input id="password" name="password" type="password" maxlength="25" required>
                    <button id="login-btn" type="submit">Sign In</button>
                </fieldset>
            </form>
        </div>
        <a href="pages/register.html">
            <p class="register">Create account here!</p>
        </a>
    </main>
    <footer>
        <p>&copy; .koble</p>
    </footer>
    <script type="module" src="src/pages/login.js"></script>
</body>

</html>
