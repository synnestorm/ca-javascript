<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">

<body>
    <header>
        <div class="h-container">
            <a href="posts.html">
                <h1>.koble</h1>
            </a>
            <input id="search" name="search" type="text" class="search" placeholder="What are you looking for?">
            <ul>
                <li><a href="profile.html"><i class="fa-regular fa-user"></i></a></li>
                <li><a href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i></a></li>

        </div>

    <main>
        <div>
            <dialog id="del-post">
                <p id="delStatus">Are you sure you want to delete post?</p>

                <button type="button" id="confirm-delete">Delete</button>
            </dialog>
        </div>
        <div id="container"></div>
    </main>
    <footer>
        <p>&copy; .koble</p>
    </footer>
    <script type="module" src="../src/pages/post.js"></script>
