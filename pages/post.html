<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect to .koble to interact with your friends! Update your post now.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <script src="https://kit.fontawesome.com/3c3001c8de.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/pages/posts.css">
    <title> .koble</title>
</head>

<body>
    <header>
        <nav class="h-container">
            <a href="posts.html">
                <h1>.koble</h1>
            </a>
            <input id="search" name="search" type="text" class="search" placeholder="What are you looking for?"
                aria-label="Search Posts">
            <ul>
                <li><a href="profile.html" aria-label="Profile"><i class="fa-regular fa-user"></i></a></li>
                <li><a href="../index.html" aria-label="Log out"><i
                            class="fa-solid fa-arrow-right-from-bracket"></i></a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <dialog id="del-post">
                <p class="status"></p>
                <p>Are you sure you want to delete post?</p>
                <button commandfor="del-post" command="close" id="cancel-btn">Cancel</button>
                <button type="button" id="confirm-delete">Delete</button>
            </dialog>
            <dialog id="edit-post">
                <form id="update-form">
                    <p class="status"></p>
                    <label for="title">Title:</label>
                    <input id="title" name="title" type="text" placeholder="Post title" required>
                    <p id="titleError"></p>
                    <label for="body">Body:</label>
                    <textarea id="body" name="body" rows="5" cols="40" placeholder="Post description"></textarea>
                    <label for="media">Image:</label>
                    <input id="media" name="media" type="url" placeholder="Post image url">
                    <button type="submit" id="confirm-edit">Edit</button>
                </form>
                <button commandfor="edit-post" command="close" class="close">Cancel</button>
            </dialog>
        </div>
        <div id="container">
            <div id="loader" class="loader"></div>
        </div>
    </main>
    <footer>
        <p>&copy; .koble</p>
    </footer>
    <script type="module" src="../src/pages/post.js"></script>
</body>

</html>
